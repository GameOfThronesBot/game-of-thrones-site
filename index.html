  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game of Thrones • Official</title>
  <meta name="description" content="Official website of Game of Thrones Discord Bot.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f3ff;
      background:
        radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.18), transparent 35%),
        radial-gradient(circle at 10% 80%, rgba(124, 58, 237, 0.08), transparent 30%),
        #050507;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 45px 45px;
      mask-image: linear-gradient(to bottom, black, transparent);
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(5,5,7,0.72);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      box-shadow: 0 0 28px rgba(139,92,246,0.28);
      font-size: 19px;
    }

    .nav-links {
      display: flex;
      gap: 28px;
    }

    .nav-links a {
      color: #aaa6b8;
      text-decoration: none;
      font-size: 14px;
      transition: 0.2s ease;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 24px 80px;
      position: relative;
    }

    .hero-content {
      max-width: 850px;
      animation: fadeUp 0.9s ease both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid rgba(139,92,246,0.25);
      border-radius: 999px;
      background: rgba(139,92,246,0.08);
      color: #c4b5fd;
      font-size: 13px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(52px, 9vw, 96px);
      line-height: 0.98;
      letter-spacing: -0.065em;
      font-weight: 800;
      background: linear-gradient(180deg, #ffffff 15%, #c4b5fd 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 25px;
    }
